name: Update hard good-news feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/fetch_good_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: dopafountain-news-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh and publish feed
        shell: bash
        run: |
          set -e
          git config user.name "dopafountain-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Feed update attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python scripts/fetch_good_news.py

            if git diff --quiet -- data/goodnews.json; then
              echo "No feed changes."
              exit 0
            fi

            git add data/goodnews.json
            git commit -m "Update hard good-news feed"

            if git push origin HEAD:main; then
              echo "Feed published."
              exit 0
            fi

            echo "Main changed during publish; retrying from latest main."
          done

          echo "Could not publish feed after 3 attempts."
          exit 1
