name: Update hard good-news feed
# v0.2 online hard-news pipeline

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/fetch_good_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: dopafountain-news-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and refine hard good news
        run: python scripts/fetch_good_news.py

      - name: Commit feed when changed
        run: |
          if git diff --quiet -- data/goodnews.json; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "dopafountain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/goodnews.json
          git commit -m "Update hard good-news feed"
          git pull --rebase origin main
          git push
